<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist</title>
      <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-[url(https://ik.imagekit.io/allah786/todolistbg.jpg)] w-[400px] h-[800px] bg-cover ">
        <div >
            <h1 class="text-white text-[42px]  flex flex-row justify-center m-5" ><b>Todolist</b></h1>
            <p class="text-white text-[16px] text-center  m-7 ">Each day I will accomplish one thing on my todo<br>list.</p>
            <h2 class="text-white text-[20px] m-2 "><b>Read a Book</b></h2>
            <p class="text-white  text-[16px] ">  I don't think that the human race will survive the next thousand years, 
            unless we spread into space. There are too many accidents that can 
            befall life on a single planet. But I'm an optimist...</p>
            <div class="flex row justify-center ">
            <button class="bg-orange-500 px-6 py-2 m-5  text-[20px] text-white border-[3px] border-[#797d68] "><b>Start</b></button>
            </div>
            <p class=" underline text-white flex flex-row justify-center" >Don't skip introduction</p>
            
        </div>
        
    </div>
    
    
</body>
</html
